[platformio]
default_envs = esp32dev

; Upload via USB
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

build_flags = 
    -D DMX_USE_RMT
    ; Web server pinned to core 1 (core 0 stays free for Wi-Fi + audio),
    ; priority below the DMX output task
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_PRIORITY=3

lib_deps =
   https://github.com/sparkfun/SparkFunDMX/
   https://github.com/kosme/arduinoFFT
   ; me-no-dev/ESP Async WebServer @ ^1.2.3
    https://github.com/me-no-dev/ESPAsyncWebServer.git 
   https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    knolleary/PubSubClient @ ^2.8
extra_scripts = pre:prepare_fs.py
		post:upload_fs_auto.py

; Upload via Wi-Fi (OTA): pio run -e esp32dev_ota -t upload
; Password must match OTA_PASSWORD in include/ota.h
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = dmx-controller.local
upload_flags = --auth=dmxupdate
