<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MH Control Center</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/i18n.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #007bff; --secondary: #28a745; --warn: #ff8800; --text: #e0e0e0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        .mh-wrap { padding: 15px; }
        .card { max-width: 420px; margin: auto; background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h3 { margin: 0 0 15px 0; color: var(--primary); text-transform: uppercase; text-align: center; }
        
        select { width: 100%; padding: 12px; background: #333; color: white; border: 1px solid #444; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        
        #joy-zone { width: 240px; height: 240px; background: #252525; border-radius: 50%; margin: 10px auto; position: relative; border: 2px solid #333; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        
        .btn-save { background: var(--secondary); }
        .btn-test { background: var(--warn); grid-column: span 2; }
        .btn-auto { background: var(--primary); grid-column: span 2; }
        
        .section { margin-top: 18px; padding-top: 14px; border-top: 1px solid #333; }
        .section-title { font-size: 12px; color: #999; text-transform: uppercase; margin-bottom: 8px; }
        .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 8px; }
        .extra-row { display: grid; grid-template-columns: 80px 1fr 36px; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
        .extra-row input[type=range] { width: 100%; }
        .extra-val { text-align: right; color: var(--primary); }

        .pos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .pos-item { display: flex; }
        .pos-item .pos-btn { flex: 1; background: #333; text-align: left; border-radius: 8px 0 0 8px; }
        .pos-item .pos-del { background: #2a2a2a; color: #888; border-radius: 0 8px 8px 0; padding: 14px 10px; }
        .pos-save { display: flex; gap: 8px; margin-top: 10px; }
        .pos-save input { flex: 1; min-width: 0; padding: 10px; background: #333; color: #fff; border: 1px solid #444; border-radius: 8px; }
        .hint { font-size: 11px; color: #777; margin-top: 6px; }

        #status { font-size: 11px; color: #666; margin-top: 15px; text-align: center; min-height: 1.2em; }
        .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444; margin-right: 5px; }
        .led.active { background: #00ff00; box-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body>

<div class="nav">
    <img src="/logo.svg" class="nav-logo" alt="">
    <a href="/">Home</a>
    <a href="/wifi">WLAN</a>
    <a href="/dmxconfig">DMX</a>
    <a href="/mh" class="active">Moving Head</a>
    <a href="/lauflicht">Lauflicht</a>
    <a href="/monitor">Monitor</a>
    <a href="/update">Update</a>
</div>

<div class="mh-wrap">
<div class="card">
    <h3>Moving Head Setup</h3>
    
    <select id="mhSelect" onchange="selectMH()">
        <option value="-1">-- Head auswählen --</option>
    </select>

    <div id="joy-zone"></div>

    <div class="grid">
        <button class="btn-save" onclick="sendCmd('save?pt=A')">PUNKT A (Start)</button>
        <button class="btn-save" onclick="sendCmd('save?pt=B')">PUNKT B (Ende)</button>
        
        <button id="testBtn" class="btn-test" onclick="toggleTestMove()">MOTOR-TEST STARTEN</button>
        
        <button class="btn-auto" onclick="sendCmd('toggleAuto')">BPM AUTO START/STOP</button>
    </div>

    <div class="section">
        <div class="section-title">Bewegung bei BPM Auto (alle Heads)</div>
        <select id="movePattern" onchange="saveMovement()">
            <option value="0">Kreis (springt im Takt)</option>
            <option value="1">Liegende Acht</option>
            <option value="2">Schwenk links/rechts</option>
            <option value="3">Nicken hoch/runter</option>
            <option value="4">Zufällige Positionen</option>
        </select>
        <label class="opt"><input type="checkbox" id="moveSpread" onchange="saveMovement()" checked> Heads versetzt (Welle)</label>
    </div>

    <div class="section">
        <div class="section-title">Positionen (alle Heads)</div>
        <div id="positions" class="pos-grid"></div>
        <div class="pos-save">
            <input type="text" id="posName" maxlength="24" placeholder="Name, z. B. Bühne">
            <button class="btn-save" onclick="savePosition()">Speichern</button>
        </div>
        <div class="hint">Speichert die aktuelle Position aller Moving Heads. Anfahren schaltet BPM Auto für diese Heads aus.</div>
    </div>

    <div class="section" id="extrasSection" style="display:none;">
        <div class="section-title">Zusatzkanäle (gewählter Head)</div>
        <div id="extras"></div>
    </div>

    <div id="status"><span id="statusLed" class="led"></span> <span id="statusTxt">Verbunden</span></div>
</div>

</div>

<!-- load nipplejs locally from the ESP32 -->
<script src="/nipplejs.min.js"></script>

<script>
    let currentId = "-1";
    let lastTs = 0;
    let isTesting = false;

    // 1. Load fixture list
    function loadList() {
        fetch('/api/fixtures')
            .then(res => res.json())
            .then(data => {
                const sel = document.getElementById('mhSelect');
                data.forEach(fx => {
                    if(fx.isMH) {
                        let opt = document.createElement('option');
                        opt.value = fx.id;
                        opt.text = `${fx.name || 'Head'} (CH: ${fx.start})`;
                        sel.add(opt);
                    }
                });
            }).catch(e => setStatus("Fehler beim Laden!", true));
    }

    function selectMH() {
        currentId = document.getElementById('mhSelect').value;
        if(currentId === "-1") return;
        fetch(`/api/select?id=${currentId}`)
            .then(res => res.json())
            .then(fx => {
                setStatus(`${fx.name}: BPM Auto ${fx.auto ? "AN" : "AUS"}`);
                showExtras(fx.extras || {});
            })
            .catch(e => setStatus("Fehler beim Auswählen!", true));
    }

    // Movement pattern (applies to all heads)
    function loadMovement() {
        fetch('/api/getConfig').then(r => r.json()).then(cfg => {
            if (cfg.movePattern !== undefined) document.getElementById('movePattern').value = String(cfg.movePattern);
            if (cfg.moveSpread !== undefined) document.getElementById('moveSpread').checked = cfg.moveSpread;
        });
    }

    function saveMovement() {
        const p = document.getElementById('movePattern').value;
        const s = document.getElementById('moveSpread').checked ? 1 : 0;
        fetch(`/api/settings?movePattern=${p}&moveSpread=${s}`).then(() => setStatus("Bewegung gespeichert"));
    }

    // Extra channels: only show those the fixture type has (configurable in the DMX config)
    const EXTRA_LABELS = { gobo: "Gobo", colorWheel: "Farbrad", prism: "Prisma", focus: "Fokus" };
    let extraTimer = {};

    function showExtras(extras) {
        const box = document.getElementById('extras');
        box.innerHTML = "";
        const keys = Object.keys(extras);
        document.getElementById('extrasSection').style.display = keys.length ? "" : "none";
        keys.forEach(key => {
            const row = document.createElement('div');
            row.className = "extra-row";

            const label = document.createElement('span');
            label.textContent = EXTRA_LABELS[key] || key;

            const slider = document.createElement('input');
            slider.type = "range"; slider.min = 0; slider.max = 255; slider.value = extras[key];

            const val = document.createElement('span');
            val.className = "extra-val";
            val.textContent = extras[key];

            slider.oninput = () => {
                val.textContent = slider.value;
                // only send once the slider rests for 100 ms (spares the ESP)
                clearTimeout(extraTimer[key]);
                extraTimer[key] = setTimeout(() =>
                    fetch(`/api/setExtra?id=${currentId}&ch=${key}&v=${slider.value}`), 100);
            };

            row.append(label, slider, val);
            box.appendChild(row);
        });
    }

    function sendCmd(path) {
        if(currentId === "-1") return alert("Bitte erst ein Gerät wählen!");
        const sep = path.includes('?') ? '&' : '?';
        fetch(`/api/${path}${sep}id=${currentId}`)
            .then(res => res.text())
            .then(txt => {
                const name = path.split('?')[0];
                if (name === "toggleAuto") setStatus("BPM Auto " + (txt === "ON" ? "AN" : "AUS"));
                else setStatus("Befehl gesendet: " + name);
            })
            .catch(e => setStatus("Fehler beim Senden!", true));
    }

    // 2. Motor test logic
    function toggleTestMove() {
        const btn = document.getElementById('testBtn');
        isTesting = !isTesting;

        if (isTesting) {
            btn.style.background = "#dc3545";
            btn.innerText = "TEST LÄUFT... (STOPP)";
            fetch('/api/setBPM?value=120'); // make sure BPM > 30
            if (currentId !== "-1") fetch(`/api/setAuto?id=${currentId}&on=1`); // the selected head moves along
            fetch('/api/setEffect?name=disco');
            setStatus("Test-Modus: Disco-Bewegung aktiv");
        } else {
            btn.style.background = "var(--warn)";
            btn.innerText = "MOTOR-TEST STARTEN";
            fetch('/api/setEffect?name=static');
            setStatus("Test beendet.");
        }
    }

    function setStatus(msg, err = false) {
        const txt = document.getElementById('statusTxt');
        const led = document.getElementById('statusLed');
        txt.innerText = msg;
        led.className = err ? "led" : "led active";
        if(!err) setTimeout(() => led.className = "led", 1000);
    }

    // 3. Joystick setup
    const joy = nipplejs.create({
        zone: document.getElementById('joy-zone'),
        mode: 'static',
        position: {left: '50%', top: '50%'},
        color: '#007bff',
        size: 140
    });

    joy.on('move', (evt, data) => {
        if (currentId === "-1") return;
        let now = Date.now();
        if (now - lastTs > 50) { // 20 FPS limiter
            // frontPosition goes from -70 to +70 (half the joystick size) → scale to 0…255
            const r = 70;
            let p = Math.round(127.5 + data.instance.frontPosition.x / r * 127.5);
            let t = Math.round(127.5 + data.instance.frontPosition.y / r * 127.5);
            p = Math.max(0, Math.min(255, p));
            t = Math.max(0, Math.min(255, t));
            
            // fast sending via XHR
            let x = new XMLHttpRequest();
            x.open("GET", `/api/move?id=${currentId}&p=${p}&t=${t}`, true);
            x.send();
            lastTs = now;
        }
    });

    // Positions
    function loadPositions() {
        fetch('/api/positions').then(r => r.json()).then(list => {
            const box = document.getElementById('positions');
            box.innerHTML = "";
            if (!list.length) {
                box.innerHTML = "<div class='hint'>Noch keine Positionen gespeichert.</div>";
                return;
            }
            list.forEach(p => {
                const item = document.createElement('div');
                item.className = "pos-item";
                const btn = document.createElement('button');
                btn.className = "pos-btn";
                btn.textContent = p.name;
                btn.onclick = () => fetch(`/api/loadPosition?id=${p.id}`).then(() => setStatus("Position: " + p.name));
                const del = document.createElement('button');
                del.className = "pos-del";
                del.textContent = "✕";
                del.onclick = () => {
                    if (confirm(`Position "${p.name}" löschen?`)) fetch(`/api/deletePosition?id=${p.id}`).then(loadPositions);
                };
                item.append(btn, del);
                box.appendChild(item);
            });
        });
    }

    function savePosition() {
        const input = document.getElementById('posName');
        const name = input.value.trim();
        if (!name) return alert("Bitte einen Namen eingeben.");
        fetch('/api/savePosition?name=' + encodeURIComponent(name)).then(async r => {
            if (!r.ok) return alert(await r.text());
            input.value = "";
            setStatus("Position gespeichert");
            loadPositions();
        });
    }

    window.onload = () => { loadList(); loadMovement(); loadPositions(); };
</script>

</body>
</html>
